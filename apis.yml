apis:
- aid: kimi-moonshot:embeddings
  name: Kimi Embeddings API
  description: >-
    OpenAI-compatible embeddings endpoint that returns vector representations of input text for semantic
    search, clustering, and retrieval-augmented generation workflows.
  humanURL: https://platform.moonshot.cn/docs
  baseURL: https://api.moonshot.cn/v1/embeddings
  tags:
  - Embeddings
  - Vectors
  properties:
  - type: Documentation
    url: https://platform.moonshot.cn/docs
- aid: kimi-moonshot:files
  name: Kimi Files API
  description: >-
    File management endpoint for uploading documents that can be referenced from chat completions (for
    example, long-document Q&A and the file_id-based context attachment pattern).
  humanURL: https://platform.moonshot.cn/docs
  baseURL: https://api.moonshot.cn/v1/files
  tags:
  - Files
  - Documents
  properties:
  - type: Documentation
    url: https://platform.moonshot.cn/docs
- aid: kimi-moonshot:fine-tuning
  name: Kimi Fine-Tuning API
  description: >-
    Fine-tuning jobs endpoint for customizing Moonshot base models on customer-supplied training data.
    Mirrors the OpenAI fine-tuning surface.
  humanURL: https://platform.moonshot.cn/docs
  baseURL: https://api.moonshot.cn/v1/fine_tuning
  tags:
  - Fine-Tuning
  - Training
  properties:
  - type: Documentation
    url: https://platform.moonshot.cn/docs
- aid: kimi-moonshot:models
  name: Kimi Models API
  description: >-
    Lists models available to the authenticated account and exposes per-model metadata (context window,
    modality support, pricing tier).
  humanURL: https://platform.moonshot.cn/docs
  baseURL: https://api.moonshot.cn/v1/models
  tags:
  - Models
  - Catalog
  properties:
  - type: Documentation
    url: https://platform.moonshot.cn/docs
- aid: kimi-moonshot:tokenizer
  name: Kimi Tokenizer API
  description: >-
    Helper endpoint exposed by the Moonshot platform for counting tokens against a given model's tokenizer
    prior to submission, useful for managing long-context budgets.
  humanURL: https://platform.moonshot.cn/docs
  baseURL: https://api.moonshot.cn/v1/tokenizers
  tags:
  - Tokenizer
  - Utilities
  properties:
  - type: Documentation
    url: https://platform.moonshot.cn/docs
- aid: kimi-moonshot:assistant
  name: Kimi Assistant (kimi.com)
  description: >-
    Consumer-facing AI assistant at kimi.com (also kimi.ai) powered by the Kimi models. Supports long-document
    upload, web search grounding, and tool use through a chat UI.
